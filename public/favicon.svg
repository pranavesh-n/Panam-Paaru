<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Neo-Brutalist Sunny Background -->
  <rect width="512" height="512" fill="#FFE600" rx="48"/>
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#121212" stroke-width="24" rx="36"/>
  
  <!-- Slanted Single P Monogram with Bitcoin ₿ Stems -->
  <g transform="translate(100, 70) skewX(-14) scale(4.0)">
    <!-- Top Bitcoin Prongs -->
    <rect x="42" y="6" width="6" height="12" rx="1" fill="#121212" />
    <rect x="56" y="6" width="6" height="12" rx="1" fill="#121212" />

    <!-- Main Solid Capital 'P' -->
    <path
      d="
        M 24 14
        H 62
        C 78 14 88 24 88 40
        C 88 56 78 66 62 66
        H 42
        V 90
        H 24
        V 14
        Z
      "
      fill="#121212"
    />

    <!-- Inner Counter Window in Sunny Gold -->
    <path
      d="
        M 42 26
        H 60
        C 69 26 74 32 74 40
        C 74 48 69 54 60 54
        H 42
        V 26
        Z
      "
      fill="#FFE600"
    />

    <!-- Bitcoin Middle Currency Slash -->
    <rect
      x="30"
      y="37"
      width="48"
      height="6"
      rx="1"
      fill="#121212"
    />

    <!-- Bottom Bitcoin Prongs -->
    <rect x="42" y="62" width="6" height="12" rx="1" fill="#121212" />
    <rect x="56" y="62" width="6" height="12" rx="1" fill="#121212" />

    <!-- Emerald Sparkle Accent -->
    <circle cx="59" cy="40" r="3.5" fill="#05DF72" stroke="#121212" stroke-width="1.5" />
  </g>
</svg>
